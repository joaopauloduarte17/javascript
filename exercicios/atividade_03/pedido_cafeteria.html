<!-- 
------------------------------------------------
Pedido da cafeteria
------------------------------------------------

Desenvolva uma página para registrar o pagamento de consumo em uma cafeteria. O atendente deverá informar:
    - nome do cliente;
    - quantidade de cafés;
    - preço de cada café;
    - valor pago pelo cliente.

Ao clicar em Calcular pedido, o sistema deverá:
    - número do pedido (que começa em 1)
    - calcular o valor total;
    - valor pago
    - verificar se o pagamento é suficiente;
    - calcular o troco ou o valor que ainda falta;

Em seguida, se aprovado apresente o resultado como:
    Pedido nº 1
    Cliente: Felipe Maciel
    Quantidade: 5
    Preço unitário: R$ 7.80
    Total: R$ 39.00
    Valor Pago: R$ 100.00
    Pagamento aprovado.
    Troco: R$ 61.00

Caso contrário, apresente: 
    Pedido nº 2
    Cliente: Felipe Maciel
    Quantidade: 5
    Preço unitário: R$ 7.80
    Total: R$ 39.00
    Valor Pago: R$ 10.00
    Pagamento insuficiente.
    Faltam R$ 29.00

-->

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cafeteria JavaScript</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Arial", "sans-serif"],
            },
            boxShadow: {
              card: "0 24px 60px -20px rgba(67, 35, 20, 0.35)",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-stone-100 px-4 py-8 text-stone-800 sm:py-12"
  >
    <main class="mx-auto w-full max-w-5xl">
      <section
        class="overflow-hidden rounded-3xl border border-white/70 bg-white shadow-card"
      >
        <div class="grid lg:grid-cols-1">
          
          <!-- Formulário -->
          <div class="p-6 sm:p-10 lg:p-12">
            <header class="mb-8">
              <p
                class="mb-2 text-sm font-semibold uppercase tracking-widest text-amber-700"
              >
                Novo atendimento
              </p>

              <h1
                id="titulo"
                class="text-3xl font-bold tracking-tight text-stone-900"
              >
                Pedido da cafeteria
              </h1>

              <p class="mt-3 text-sm leading-6 text-stone-500">
                Preencha os campos abaixo para calcular o pedido.
              </p>
            </header>

            <div class="space-y-5">
              <!-- Nome -->
              <div>
                <label
                  for="nome"
                  class="mb-2 block text-sm font-semibold text-stone-700"
                >
                  Nome do cliente
                </label>

                <div class="relative">
                  <div
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-stone-400"
                  >
                    <svg
                      class="h-5 w-5"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.7"
                      stroke="currentColor"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0"
                      />
                    </svg>
                  </div>

                  <input
                    type="text"
                    id="nome"
                    placeholder="Ex.: Felipe Maciel"
                    autocomplete="name"
                    class="w-full rounded-xl border border-stone-200 bg-stone-50 py-3.5 pl-12 pr-4 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 hover:border-amber-300 focus:border-amber-600 focus:bg-white focus:ring-4 focus:ring-amber-100"
                  />
                </div>
              </div>

              <!-- Quantidade e preço -->
              <div class="grid gap-5 sm:grid-cols-2">
                <div>
                  <label
                    for="quantidade"
                    class="mb-2 block text-sm font-semibold text-stone-700"
                  >
                    Quantidade de cafés
                  </label>

                  <div class="relative">
                    <div
                      class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-stone-400"
                    >
                      <svg
                        class="h-5 w-5"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.7"
                        stroke="currentColor"
                        aria-hidden="true"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M6 13.5V7.25A1.25 1.25 0 0 1 7.25 6h7.5A1.25 1.25 0 0 1 16 7.25v6.25A4.5 4.5 0 0 1 11.5 18h-1A4.5 4.5 0 0 1 6 13.5Zm10-5h1.5a2.5 2.5 0 0 1 0 5H16"
                        />
                      </svg>
                    </div>

                    <input
                      type="number"
                      id="quantidade"
                      placeholder="Ex.: 5"
                      min="1"
                      class="w-full rounded-xl border border-stone-200 bg-stone-50 py-3.5 pl-12 pr-4 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 hover:border-amber-300 focus:border-amber-600 focus:bg-white focus:ring-4 focus:ring-amber-100"
                    />
                  </div>
                </div>

                <div>
                  <label
                    for="preco"
                    class="mb-2 block text-sm font-semibold text-stone-700"
                  >
                    Preço unitário
                  </label>

                  <div class="relative">
                    <span
                      class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-sm font-semibold text-stone-400"
                    >
                      R$
                    </span>

                    <input
                      type="number"
                      id="preco"
                      step="0.01"
                      min="0.01"
                      placeholder="0,00"
                      class="w-full rounded-xl border border-stone-200 bg-stone-50 py-3.5 pl-12 pr-4 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 hover:border-amber-300 focus:border-amber-600 focus:bg-white focus:ring-4 focus:ring-amber-100"
                    />
                  </div>
                </div>
              </div>

              <!-- Pagamento -->
              <div>
                <label
                  for="pagamento"
                  class="mb-2 block text-sm font-semibold text-stone-700"
                >
                  Valor pago pelo cliente
                </label>

                <div class="relative">
                  <span
                    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-sm font-semibold text-stone-400"
                  >
                    R$
                  </span>

                  <input
                    type="number"
                    id="pagamento"
                    step="0.01"
                    min="0"
                    placeholder="0,00"
                    class="w-full rounded-xl border border-stone-200 bg-stone-50 py-3.5 pl-12 pr-4 text-sm text-stone-900 outline-none transition placeholder:text-stone-400 hover:border-amber-300 focus:border-amber-600 focus:bg-white focus:ring-4 focus:ring-amber-100"
                  />
                </div>
              </div>

              <!-- Botão -->
              <button
                id="btnCalcular"
                type="button"
                class="group flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-amber-700 to-orange-700 px-5 py-4 text-sm font-bold text-white shadow-lg shadow-amber-900/20 transition duration-200 hover:-translate-y-0.5 hover:from-amber-800 hover:to-orange-800 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-amber-200 active:translate-y-0"
              >
                <svg
                  class="h-5 w-5 transition-transform group-hover:rotate-6"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.75 3.75h10.5a1.5 1.5 0 0 1 1.5 1.5v13.5a1.5 1.5 0 0 1-1.5 1.5H6.75a1.5 1.5 0 0 1-1.5-1.5V5.25a1.5 1.5 0 0 1 1.5-1.5ZM8.25 7.5h7.5M8.25 11.25h1.5m2.25 0h1.5m2.25 0h.01M8.25 15h1.5m2.25 0h1.5m2.25 0h.01"
                  />
                </svg>

                Calcular pedido
              </button>
            </div>

            <!-- Resultado -->
            <div
              id="resultado"
              role="status"
              aria-live="polite"
              class="mt-7 rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm leading-7 text-stone-700 shadow-sm"
            >
              Preencha os dados do pedido.
            </div>
          </div>
        </div>
      </section>


    </main>

    <script>
      let nomeCampo = document.querySelector("#nome");
      let qtdCafeCampo = document.querySelector("#quantidade");
      let precoUniCampo = document.querySelector("#preco");
      let valorPagoCampo = document.querySelector("#pagamento");
      let btnCalcular = document.querySelector("#btnCalcular");
      let dadosPedido = document.querySelector("#resultado");
      let pedido = 0;
      
      btnCalcular.addEventListener("click", function(){
        let nome = nomeCampo.value;
        let qtdCafe = Number(qtdCafeCampo.value);
        let precoUni = Number(precoUniCampo.value);
        let valorPago = Number(valorPagoCampo.value);

        let valorTotal = qtdCafe * precoUni;
        let isSuficiente = valorPago >= valorTotal;

        //Calculo troco
        let calcTroco = isSuficiente ? valorPago - valorTotal : valorTotal - valorPago;

        pedido += 1;
        
        if (isSuficiente == true){
          dadosPedido.innerHTML = `
            <h2 style = "font-size: 20px"> DADOS DO PEDIDO </h2> 

            <p><strong>Pedido n°</strong> ${pedido} </p>
            <p><strong>Cliente: </strong> ${nome} </p>
            <p><strong>Quantidade:</strong> ${qtdCafe} </p>
            <p><strong>Preço unitário:</strong> R$ ${precoUni.toFixed(2)} </p>
            <p><strong>Total:</strong> R$ ${valorTotal.toFixed(2)} </p>
            <p><strong>Valor pago:</strong> R$ ${valorPago.toFixed(2)} </p>
            <p><strong>Pagamento aprovado.</strong> </p>
            <p><strong>Troco:</strong> R$ ${calcTroco.toFixed(2)} </p>          
          `
        }else{
          dadosPedido.innerHTML = `
            <h2 style = "font-size: 20px"> DADOS DO PEDIDO </h2> 

            <p><strong>Pedido n°</strong> ${pedido} </p>
            <p><strong>Cliente: </strong> ${nome} </p>
            <p><strong>Quantidade:</strong> ${qtdCafe} </p>
            <p><strong>Preço unitário:</strong> R$ ${precoUni.toFixed(2)} </p>
            <p><strong>Total:</strong> R$ ${valorTotal.toFixed(2)} </p>
            <p><strong>Valor pago:</strong> R$ ${valorPago.toFixed(2)} </p>
            <p><strong>Pagamento insuficiente.</strong> </p>
            <p><strong>Faltam:</strong> R$ ${calcTroco.toFixed(2)} </p>          
          `
        }
      })
    </script>
  </body>
</html>
