<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção</title>
</head>

<body>
    <script>
        let n1 = Number(prompt('Digite o numero 1'));
        let n2 = Number(prompt('Digite o numero 2'));
        let n3 = Number(prompt('Digite o numero 3'));

        if (n1 == n2 || n1 == n3 || n2 == n3) {
            alert('Existem 2 ou mais números iguais');
        }else if(n1 > n2 && n1 > n3){
            alert(`O numero ${n1} é o maior`);
        }else if(n2 > n1 && n2 > n3){
            alert(`O numero ${n2} é o maior`);
        }else{
            alert(`O numero ${n3} é o maior`);
        }

    </script>
</body>

</html>
